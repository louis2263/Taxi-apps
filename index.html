<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>的士/乘客 即時雷達</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; }
    #role-select {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.95); z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }
    .btn {
      padding: 15px 40px; font-size: 20px; font-weight: bold;
      border: none; border-radius: 12px; cursor: pointer; width: 200px; color: white;
    }
    .btn-passenger { background-color: #007bff; }
    .btn-taxi { background-color: #28a745; }
  </style>
</head>
<body>

  <div id="role-select">
    <h2>請選擇你的身分</h2>
    <button class="btn btn-passenger" onclick="selectRole('passenger')">乘客</button>
    <button class="btn btn-taxi" onclick="selectRole('taxi')">的士</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    let myRole = null;
    let map = L.map('map').setView([22.218, 114.209], 15);
    let socket = null;
    let markers = {};

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const taxiIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
      iconSize: [35, 35]
    });

    const passengerIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/1077/1077012.png',
      iconSize: [30, 30]
    });

    function selectRole(role) {
      myRole = role;
      document.getElementById('role-select').style.display = 'none';
      socket = io();

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition((position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          map.setView([lat, lng]);

          socket.emit('update-location', { role: myRole, lat: lat, lng: lng });
        }, (err) => {
          alert('請允許存取 GPS 位置');
        }, { enableHighAccuracy: true });
      }

      socket.on('location-update', (users) => {
        Object.keys(users).forEach(id => {
          if (id === socket.id) return;
          const user = users[id];

          if (myRole === 'passenger' && user.role !== 'taxi') return;
          if (myRole === 'taxi' && user.role !== 'passenger') return;

          const icon = user.role === 'taxi' ? taxiIcon : passengerIcon;

          if (markers[id]) {
            markers[id].setLatLng([user.lat, user.lng]);
          } else {
            markers[id] = L.marker([user.lat, user.lng], { icon: icon }).addTo(map);
          }
        });
      });

      socket.on('user-disconnected', (id) => {
        if (markers[id]) {
          map.removeLayer(markers[id]);
          delete markers[id];
        }
      });
    }
  </script>
</body>
</html>
